<link rel="stylesheet" href="/m3.css">
<style>
  /* The 404 borrows the index palette from m3.css and only overrides the dark
     roles it needs; the theme still follows the choice made on the other pages. */
  :root { color-scheme: light; }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --md-sys-color-surface: #0e0e10;
    --md-sys-color-on-surface: #ece9e1;
    --md-sys-color-on-surface-variant: #a8a49a;
    --md-sys-color-primary: #ece9e1;
    --md-sys-color-on-primary: #141311;
    --md-sys-color-outline-variant: #2c2c31;
  }
  body {
    margin: 0;
    background: var(--md-sys-color-surface);
    color: var(--md-sys-color-on-surface);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans",
      "Noto Sans TC", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; }
  h1 {
    margin: 0 0 1rem;
    font-size: var(--md-sys-type-headline-size);
    line-height: 1.1;
    letter-spacing: -0.02em;
  }
  p { color: var(--md-sys-color-on-surface-variant); }
  a { color: var(--md-sys-color-on-surface); text-decoration-thickness: 1px; }
  a:hover { color: var(--md-sys-color-primary); }
  ul { padding-left: 1.2rem; }
</style>
</head>
