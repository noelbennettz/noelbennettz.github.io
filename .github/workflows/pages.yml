name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A workflow_dispatch run from before the migration has been stuck in GitHub's
  # queue under the old "pages" group. A distinct group lets current deploys run
  # instead of waiting behind it; cancel-in-progress still supersedes our own.
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Verify links and sitemap
        run: |
          python3 scripts/check-links.py
          python3 scripts/gen-sitemap.py --check

      # The deployed tree is a copy: asset references carry the commit so a CSS
      # change is not hidden behind a cached stylesheet.
      - name: Stage the site
        run: python3 scripts/stamp-assets.py docs _site "$GITHUB_SHA"

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      # The Pages deploy API occasionally reads the artifact list before the
      # upload is visible; a short pause avoids a false "no artifacts" failure.
      - name: Let the artifact propagate
        run: sleep 10

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Housekeeping: the site history is useful only until the next deploy.
  prune:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Delete every run but the newest
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/prune-runs.sh 1
