name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A workflow_dispatch run from before the migration has been stuck in GitHub's
  # queue under the old "pages" group. A distinct group lets current deploys run
  # instead of waiting behind it; cancel-in-progress still supersedes our own.
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Verify links and sitemap
        run: |
          python3 scripts/check-links.py
          python3 scripts/gen-sitemap.py --check

      # The deployed tree is a copy: asset references carry the commit so a CSS
      # change is not hidden behind a cached stylesheet.
      - name: Stage the site
        run: python3 scripts/stamp-assets.py docs _site "$GITHUB_SHA"

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      # The Pages deploy API occasionally reads the artifact list before the
      # upload is visible; a short pause avoids a false "no artifacts" failure.
      - name: Let the artifact propagate
        run: sleep 10

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # Housekeeping: the site history is useful only until the next deploy.
  prune:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Delete every run but the newest
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/prune-runs.sh 1
