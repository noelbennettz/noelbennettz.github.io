name: checks

# Static-site checks that do not need Pages credentials: broken local links and
# a sitemap that matches the files on disk. The Pages-state check runs only for
# a push to main or a manual run because it needs the repository token.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  docs:
    name: Links and sitemap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check local links
        run: python3 scripts/check-links.py
      - name: Check sitemap
        run: python3 scripts/gen-sitemap.py --check
      - name: Compile the helper scripts
        run: python3 -m py_compile scripts/*.py
      - name: Stage a preview
        if: github.event_name == 'pull_request'
        run: python3 scripts/stamp-assets.py docs _site "$GITHUB_SHA"
      - name: Upload the preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-preview
          path: _site

  pages-state:
    name: Pages layout
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that the central site is enabled and the project sites are not
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-pages.sh
